# Rev 42: sim-core changes merge into Main-REPO only after `pnpm check` passes on Windows.
# This job is that Windows check (plus Linux) while the laptop is unavailable; the laptop remains an alternative.
name: check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [Main-REPO]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
