# Rev 42: sim-core changes merge into Main-REPO only after `pnpm check` passes on Windows.
# This job is that Windows check (plus Linux) while the laptop is unavailable; the laptop remains an alternative.
name: check

# Manual only while the GitHub account has a billing issue (2026-11-02): every automatic run
# ended in startup_failure. When billing is fixed, restore:
#   push: { branches: [Main-REPO] }
#   pull_request: { branches: [Main-REPO] }
on:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # GitHub-made actions only; corepack provides the pnpm version pinned in packageManager
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
